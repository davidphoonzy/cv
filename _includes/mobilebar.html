<header class="mobilebar">
    <div class="mobilebar-name">
    </div>

    <nav class="mobilebar-directory">
        {% assign sections = site.sections | sort: "order" %}
        {% for section in sections %}
            <a href="#{{ section.slug }}" class="mobilebar-section">
                {{ section.title }} 
            </a>
        {% endfor %}
    </nav>



</header>
